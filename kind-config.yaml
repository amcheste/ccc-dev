kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Traefik binds hostPort 80 on this node; kind maps it to the
      # host so http://ccc.localhost works without port-forwards.
      - containerPort: 80
        hostPort: 80
        protocol: TCP
